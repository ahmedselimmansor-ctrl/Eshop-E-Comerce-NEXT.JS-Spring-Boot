spring:
  application:
    name: eshop-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # stringtype=unspecified lets PostgreSQL infer the target type for string parameters, so the
    # `citext` and `inet` columns bind from plain Java Strings without an explicit ::cast on every
    # statement. JSONB columns are handled separately via @JdbcTypeCode(SqlTypes.JSON).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eshop}?stringtype=unspecified
    username: ${DB_USER:eshop}
    password: ${DB_PASSWORD:eshop}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Must stay false: `hibernate.connection.provider_disables_autocommit` below promises Hibernate
      # that the pool hands out connections with autocommit already off, and Hibernate then skips the
      # per-transaction setAutoCommit round trip. With Hikari's default of true the promise is broken
      # and every commit fails with "Cannot commit when autoCommit is enabled".
      auto-commit: false
      pool-name: eshop-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
        connection:
          provider_disables_autocommit: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2s
        shutdown-timeout: 200ms

  cache:
    type: redis
    redis:
      time-to-live: 300s
      cache-null-values: false
      key-prefix: "eshop:cache:"
      use-key-prefix: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Spring Cloud GCP's auto-configurations build their clients eagerly and fail outright without a
  # project id and Application Default Credentials. The application's own feature flags
  # (eshop.pubsub.enabled, eshop.storage.provider) are read far too late to prevent that, so each
  # one is gated here as well - off by default, so a checkout runs locally with no GCP account, and
  # switched on per environment. The variables are shared with the application flags so the two
  # cannot drift apart.
  cloud:
    gcp:
      # Never used. It is only on the classpath because firebase-admin, which is there for FCM push
      # notifications, happens to ship the Firestore client.
      firestore:
        enabled: false
      pubsub:
        enabled: ${PUBSUB_ENABLED:false}
      secretmanager:
        enabled: ${GCP_SECRET_MANAGER_ENABLED:false}
      storage:
        enabled: ${GCS_ENABLED:false}

  # Read directly by OAuthService via @Value, not by Spring's OAuth2 client auto-configuration -
  # see the note in pom.xml. Blank is a supported state: Google sign-in is then simply unavailable
  # and the endpoint answers with a clear error instead of the application failing to start.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            redirect-uri: "${APP_BASE_URL:http://localhost:8080}/api/v1/auth/oauth/google/callback"

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,application/javascript
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false
  tomcat:
    max-http-form-post-size: 2MB
    threads:
      max: 200
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# ============================================================
# Application configuration
# ============================================================
eshop:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  web-url: ${WEB_BASE_URL:http://localhost:3000}
  admin-url: ${ADMIN_BASE_URL:http://localhost:3001}
  default-locale: ar
  supported-locales: ar,en
  default-currency: EGP

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: X-Request-Id,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset,Retry-After,Content-Disposition
    allow-credentials: true
    max-age: 3600

  jwt:
    issuer: ${JWT_ISSUER:https://api.eshop.eg}
    audience: eshop-clients
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    # PEM (PKCS#8 / X.509). In local dev an ephemeral keypair is generated when blank.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    refresh-cookie-name: refresh_token
    refresh-cookie-domain: ${REFRESH_COOKIE_DOMAIN:}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}

  security:
    max-failed-logins: 5
    lockout-minutes: 15
    password-min-length: 8
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory-kb: 19456   # 19 MiB - OWASP recommended (m=19456, t=2, p=1)
      iterations: 2

  rate-limit:
    enabled: true
    tiers:
      anonymous: { capacity: 60, window-seconds: 60 }
      authenticated: { capacity: 300, window-seconds: 60 }
      admin: { capacity: 1000, window-seconds: 60 }
      login: { capacity: 5, window-seconds: 900 }
      register: { capacity: 3, window-seconds: 3600 }
      password-reset: { capacity: 3, window-seconds: 3600 }
      checkout: { capacity: 10, window-seconds: 60 }
      search: { capacity: 120, window-seconds: 60 }

  cache-ttl:
    category-tree: 600
    product-detail: 300
    product-list: 120
    brands: 900
    attributes: 900
    settings: 300
    shipping-methods: 600
    dashboard: 60

  cart:
    guest-ttl-days: 30
    user-ttl-days: 90
    max-items: 100
    max-quantity-per-item: 999

  checkout:
    reservation-minutes: 30
    idempotency-ttl-hours: 24
    cod-fee: 20.00
    free-shipping-threshold: 1000.00
    default-tax-rate: 0.14

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connect-timeout-ms: 3000
    socket-timeout-ms: 10000
    product-index: eshop-products
    enabled: ${ELASTICSEARCH_ENABLED:true}

  storage:
    provider: ${STORAGE_PROVIDER:gcs}      # gcs | local
    project-id: ${GCP_PROJECT_ID:eshop-local}
    media-bucket: ${GCS_MEDIA_BUCKET:eshop-media-local}
    private-bucket: ${GCS_PRIVATE_BUCKET:eshop-private-local}
    cdn-base-url: ${GCS_CDN_BASE_URL:http://localhost:4443/eshop-media-local}
    signed-url-ttl-minutes: 15
    max-upload-size-bytes: 10485760
    allowed-content-types: image/jpeg,image/png,image/webp,image/avif,application/pdf

  pubsub:
    enabled: ${PUBSUB_ENABLED:false}
    topic-prefix: ${PUBSUB_TOPIC_PREFIX:eshop}
    outbox-poll-ms: 2000
    outbox-batch-size: 100
    max-attempts: 10

  payment:
    return-url: ${WEB_BASE_URL:http://localhost:3000}/checkout/callback
    paymob:
      enabled: ${PAYMOB_ENABLED:true}
      base-url: ${PAYMOB_BASE_URL:https://accept.paymob.com/api}
      api-key: ${PAYMOB_API_KEY:}
      public-key: ${PAYMOB_PUBLIC_KEY:}
      secret-key: ${PAYMOB_SECRET_KEY:}
      hmac-secret: ${PAYMOB_HMAC_SECRET:}
      iframe-id: ${PAYMOB_IFRAME_ID:}
      integration-id-card: ${PAYMOB_INTEGRATION_ID_CARD:}
      integration-id-wallet: ${PAYMOB_INTEGRATION_ID_WALLET:}
      integration-id-installment: ${PAYMOB_INTEGRATION_ID_INSTALLMENT:}
    fawry:
      enabled: ${FAWRY_ENABLED:true}
      base-url: ${FAWRY_BASE_URL:https://atfawry.fawrystaging.com}
      merchant-code: ${FAWRY_MERCHANT_CODE:}
      security-key: ${FAWRY_SECURITY_KEY:}
      expiry-hours: 48
    cod:
      enabled: true
      max-order-amount: 20000.00

  notification:
    from-email: ${MAIL_FROM:no-reply@eshop.eg}
    from-name: Eshop
    fcm:
      enabled: ${FCM_ENABLED:false}
      credentials-json: ${FCM_CREDENTIALS_JSON:}

  admin:
    dashboard-max-range-days: 365
    export-max-rows: 50000

logging:
  level:
    root: INFO
    com.eshop: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
