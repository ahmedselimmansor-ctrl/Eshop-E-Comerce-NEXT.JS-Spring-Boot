# Shared dev cluster on GCP
spring:
  # Running on GCP, so the Spring Cloud GCP auto-configurations the base config leaves off — it
  # defaults to off so a local checkout needs no GCP account — are switched back on here.
  cloud:
    gcp:
      pubsub:
        enabled: true
      secretmanager:
        enabled: true
      storage:
        enabled: true

  jpa:
    show-sql: false
  flyway:
    enabled: true

eshop:
  storage:
    provider: gcs
  pubsub:
    enabled: true
  rate-limit:
    enabled: false      # off so the team can hammer the dev API freely

management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.eshop: DEBUG
