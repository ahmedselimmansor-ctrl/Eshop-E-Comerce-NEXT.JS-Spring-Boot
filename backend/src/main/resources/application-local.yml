# Local development against docker-compose.yml
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true

eshop:
  storage:
    provider: local
    cdn-base-url: http://localhost:8080/media
  pubsub:
    enabled: false
  payment:
    paymob:
      base-url: https://accept.paymob.com/api
    fawry:
      base-url: https://atfawry.fawrystaging.com
  notification:
    fcm:
      enabled: false
  rate-limit:
    enabled: true

management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.eshop: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId:-}]){magenta} %clr(%-40.40logger{39}){cyan} : %m%n%wEx"
