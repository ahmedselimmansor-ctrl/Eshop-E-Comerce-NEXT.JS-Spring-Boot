name: CI

# Runs on every push and pull request. The job of this workflow is to make a broken change visible
# before it reaches a branch anyone deploys from - it builds, tests, and scans, but never deploys.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  # A new push supersedes the run in flight for the same ref. Without this, a branch with rapid
  # pushes queues up runs that are all testing outdated code.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- backend --
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Real PostgreSQL and Redis, published on localhost where the test suite expects them. The
    # integration tests exist to catch what a mock cannot see - a jsonb column rejecting a value, a
    # lazy association read after its session closed, a migration that does not apply - so stubbing
    # these out would remove the only reason the suite is worth running.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eshop
          POSTGRES_USER: eshop
          POSTGRES_PASSWORD: eshop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eshop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2 keyed on the POM, so a source-only change skips the dependency download.
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn -B -ntp clean compile

      # One pass. The suite mixes fast pure-Java tests (Money arithmetic, the ArchUnit layering
      # rules) with tests that drive the real HTTP stack against a real database; splitting them
      # across two Maven invocations would only pay the JVM and context startup twice.
      - name: Tests
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_USER: eshop
          TEST_DB_PASSWORD: eshop
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: '6379'
        run: mvn -B -ntp test

      - name: Package
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  # -------------------------------------------------------------- migrations --
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eshop
          POSTGRES_USER: eshop
          POSTGRES_PASSWORD: eshop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eshop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Applies every migration to an empty database, then applies the repeatable ones a second
      # time. The second pass is the point: an R__ migration that is not genuinely idempotent
      # passes on a fresh database and fails on every subsequent deploy.
      - name: Apply migrations
        env:
          PGPASSWORD: eshop
        run: |
          set -euo pipefail
          for file in backend/src/main/resources/db/migration/V*.sql; do
            echo "→ $(basename "$file")"
            psql -h localhost -U eshop -d eshop -v ON_ERROR_STOP=1 -q -f "$file"
          done
          for file in backend/src/main/resources/db/migration/R__*.sql; do
            echo "→ $(basename "$file") (first pass)"
            psql -h localhost -U eshop -d eshop -v ON_ERROR_STOP=1 -q -f "$file"
            echo "→ $(basename "$file") (idempotency check)"
            psql -h localhost -U eshop -d eshop -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Verify seed data
        env:
          PGPASSWORD: eshop
        run: |
          set -euo pipefail
          check() {
            actual=$(psql -h localhost -U eshop -d eshop -tAc "SELECT count(*) FROM $1")
            if [ "$actual" -lt "$2" ]; then
              echo "::error::$1 has $actual rows, expected at least $2"
              exit 1
            fi
            echo "$1: $actual"
          }
          check permissions 25
          check roles 6
          check role_permissions 50
          check shipping_methods 5
          check settings 10

  # ------------------------------------------------------------------- web --
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs exactly the lockfile. `npm install` may resolve a different version than
      # was tested, which makes the build non-reproducible.
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm run test

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  # -------------------------------------------------------------- security --
  # ------------------------------------------------------------------ mobile --
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install
        working-directory: mobile
        run: flutter pub get

      # `analyze` is the closest thing to a compile here: it is what catches an undefined parameter
      # or a type error without needing a device or an emulator in CI.
      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Tests
        working-directory: mobile
        run: flutter test

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reports rather than blocks: a new CVE disclosed overnight should not stop an unrelated fix
    # from merging. The scheduled scan in security-scan.yml is what drives remediation.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Catches a committed key or token. The one CI check whose failure should always stop
      # everything - a leaked secret is not fixable by reverting the commit.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ----------------------------------------------------------------- infra --
  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform format
        run: terraform fmt -recursive -check infra/terraform

      - name: Terraform validate
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            dir="infra/terraform/envs/$env"
            [ -d "$dir" ] || continue
            echo "→ $env"
            # -backend=false validates syntax and provider schemas without needing state access,
            # so a pull request from a fork can still run this.
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Render Kubernetes manifests
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            echo "→ $env"
            kubectl kustomize "infra/k8s/overlays/$env" > /dev/null
          done
