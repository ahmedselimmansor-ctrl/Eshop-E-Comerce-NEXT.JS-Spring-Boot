# Secrets come from Google Secret Manager, never from a committed file.
#
# The External Secrets Operator reads them with the cluster's Workload Identity and projects them
# into a Kubernetes Secret that the Deployment mounts. Three properties follow from that:
#
#   1. No secret value exists in this repository, in a container image, or in a CI variable.
#   2. Rotating a secret is a Secret Manager write; the operator refreshes it within the interval
#      below and the pods pick it up on their next restart.
#   3. Access is auditable — Secret Manager logs every read, with the identity that made it.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID_PLACEHOLDER
      auth:
        workloadIdentity:
          clusterLocation: REGION_PLACEHOLDER
          clusterName: CLUSTER_NAME_PLACEHOLDER
          serviceAccountRef:
            name: eshop-api

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eshop-api-secrets
spec:
  # Frequent enough that a rotation takes effect the same hour, infrequent enough not to spend
  # Secret Manager quota on polling.
  refreshInterval: 15m

  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore

  target:
    name: eshop-api-secrets
    creationPolicy: Owner

  data:
    # ---- database ----------------------------------------------------------
    - secretKey: DB_PASSWORD
      remoteRef:
        key: eshop-db-password

    # ---- redis -------------------------------------------------------------
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: eshop-redis-auth

    # ---- JWT signing -------------------------------------------------------
    # The private key is the single most sensitive value here: whoever holds it can mint a token
    # for any customer or administrator. It is stored only in Secret Manager, and rotating it
    # invalidates every outstanding access token — see docs/06-RUNBOOKS.md.
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: eshop-jwt-private-key
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: eshop-jwt-public-key

    # ---- payments ----------------------------------------------------------
    - secretKey: PAYMOB_API_KEY
      remoteRef:
        key: eshop-paymob-api-key
    - secretKey: PAYMOB_SECRET_KEY
      remoteRef:
        key: eshop-paymob-secret-key
    - secretKey: PAYMOB_HMAC_SECRET
      remoteRef:
        key: eshop-paymob-hmac-secret
    - secretKey: FAWRY_MERCHANT_CODE
      remoteRef:
        key: eshop-fawry-merchant-code
    - secretKey: FAWRY_SECURITY_KEY
      remoteRef:
        key: eshop-fawry-security-key

    # ---- search ------------------------------------------------------------
    - secretKey: ELASTICSEARCH_PASSWORD
      remoteRef:
        key: eshop-elasticsearch-password

    # ---- mail and push -----------------------------------------------------
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: eshop-mail-password
    - secretKey: FCM_CREDENTIALS_JSON
      remoteRef:
        key: eshop-fcm-credentials

    # ---- OAuth -------------------------------------------------------------
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: eshop-google-client-secret

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eshop-api
  annotations:
    # Binds this Kubernetes service account to a Google service account. The pod then obtains
    # Google credentials from the metadata server — no key file, nothing to leak, nothing to rotate.
    iam.gke.io/gcp-service-account: eshop-api@PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com
