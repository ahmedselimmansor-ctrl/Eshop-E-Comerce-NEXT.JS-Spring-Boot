# Storefront and admin dashboard.
#
# Both are stateless Next.js servers, so they differ only in image, replica count, and how
# aggressively they scale. The storefront takes public traffic and scales to twenty; the admin
# dashboard serves a handful of staff and never needs more than four.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-web
  labels:
    app.kubernetes.io/name: eshop-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: eshop-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eshop-web
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30

      containers:
        - name: web
          image: eshop/web:latest
          ports:
            - name: http
              containerPort: 3000

          env:
            - name: NODE_ENV
              value: production
            # Server components call the API through the cluster Service, so a render never leaves
            # the cluster or passes through the external load balancer.
            - name: API_INTERNAL_BASE_URL
              value: http://eshop-api.eshop.svc.cluster.local
            - name: PORT
              value: '3000'

          resources:
            requests:
              # Node is far lighter than the JVM, and a Next.js server that mostly proxies and
              # renders cached pages does not need a full core.
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20

          livenessProbe:
            # Checks only that the Node process answers. Deliberately not the API - restarting the
            # storefront because the backend is briefly unavailable is exactly wrong: that is when
            # you most want it up, serving cached pages and a useful message.
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 2

          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']

          volumeMounts:
            # Next.js writes its image-optimisation cache here; the rest of the filesystem is
            # read-only.
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eshop-web

---
apiVersion: v1
kind: Service
metadata:
  name: eshop-web
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eshop-web
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eshop-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eshop-web
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eshop-web
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: eshop-web

---
# ---------------------------------------------------------------------------
# Admin dashboard
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-admin
  labels:
    app.kubernetes.io/name: eshop-admin
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: eshop-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eshop-admin
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: eshop/admin:latest
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: API_INTERNAL_BASE_URL
              value: http://eshop-api.eshop.svc.cluster.local
            - name: PORT
              value: '3001'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: eshop-admin
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eshop-admin
  ports:
    - name: http
      port: 80
      targetPort: http
