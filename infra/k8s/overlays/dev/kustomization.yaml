apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared dev cluster. Single replicas, rate limiting off so the team can hammer the API, and
# migrations applied by the app on startup rather than by a separate Job — the extra deploy step
# is not worth it here.

namespace: eshop

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

configMapGenerator:
  - name: eshop-api-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - FLYWAY_ENABLED=true
      - TRACE_SAMPLE_RATE=1.0
      - LOG_LEVEL_APP=DEBUG
