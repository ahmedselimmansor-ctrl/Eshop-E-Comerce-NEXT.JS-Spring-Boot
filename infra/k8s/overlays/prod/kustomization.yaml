apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production. Differs from the base only in scale and sampling - the shape of the deployment is
# identical, which is what makes staging a meaningful rehearsal.

namespace: eshop

resources:
  - ../../base

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: eshop-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 4
      - op: replace
        path: /spec/maxReplicas
        value: 50

  - target:
      kind: HorizontalPodAutoscaler
      name: eshop-web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

configMapGenerator:
  - name: eshop-api-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      # 5% sampling: enough to characterise latency, cheap enough to leave on permanently.
      - TRACE_SAMPLE_RATE=0.05
      - LOG_LEVEL_APP=INFO
