include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # RTL correctness. These three are the difference between an app that works in Arabic and one
    # that looks subtly broken: hard-coded left/right padding and alignment do not mirror.
    - use_decorated_box
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print
    - require_trailing_commas
    - unawaited_futures
    - always_declare_return_types
