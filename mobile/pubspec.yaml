name: eshop
description: Eshop mobile client — Arabic-first storefront for iOS and Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- state -----------------------------------------------------------------
  # Riverpod with code generation: providers are declared as annotated functions, so their types
  # and dependencies are checked at compile time rather than discovered at runtime.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ---- navigation ------------------------------------------------------------
  # Declarative routing with typed routes, which is what makes deep links from a push notification
  # ("your order shipped") land on the right screen with the right arguments.
  go_router: ^14.6.2

  # ---- networking ------------------------------------------------------------
  dio: ^5.7.0
  # Retries idempotent requests on a dropped connection — worth having on a mobile network.
  # Pinned to 6.x: 7.x requires a newer `collection` than the Flutter SDK pins, so the
  # constraint above it does not resolve at all against Flutter 3.24.
  dio_smart_retry: ^6.0.0

  # ---- models ----------------------------------------------------------------
  # Immutable models with generated equality and JSON. The API's shape is mirrored here the same
  # way the web client mirrors it in Zod.
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ---- storage ---------------------------------------------------------------
  # Refresh tokens go in the platform keychain / EncryptedSharedPreferences — never in
  # SharedPreferences, which is plain text on a rooted device.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4

  # ---- ui --------------------------------------------------------------------
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # ---- platform --------------------------------------------------------------
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  # Opens the Paymob iframe and the Fawry hosted page in an in-app browser tab rather than a
  # WebView: the address bar and the platform's own TLS indicator stay visible, which is what lets
  # a customer verify they are on the real payment page.
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Fonts are deliberately not declared here.
  #
  # IBM Plex Sans Arabic would be the right choice — one of the few Arabic families with a real
  # weight range, and Arabic carries far less hierarchy through case than Latin, so weight has to do
  # that work. But the .ttf files are not in the repository, and declaring assets that do not exist
  # fails the asset bundle before a single test runs, which is worse than falling back to the
  # platform's own Arabic font.
  #
  # To use it: download the family into mobile/assets/fonts/ and restore the block below, then set
  # _fontFamily in lib/core/theme/app_theme.dart back to 'IBMPlexSansArabic'.
  #
  #   fonts:
  #     - family: IBMPlexSansArabic
  #       fonts:
  #         - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
  #         - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
  #           weight: 500
  #         - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
  #           weight: 600
  #         - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
  #           weight: 700
